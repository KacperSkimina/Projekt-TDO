services:
  - type: web
    name: rating-system-api
    env: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend/rating-system
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: rating-db
          property: connectionString
  - type: db
    name: rating-db
    engine: postgres
    plan: free
    region: frankfurt