services:
  - type: web
    name: rating-system-api
    env: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend/rating-system
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: rating-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: rating-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: rating-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update # Automatycznie stworzy tabele w Postgresie

databases:
  - name: rating-db
    plan: free
    region: frankfurt