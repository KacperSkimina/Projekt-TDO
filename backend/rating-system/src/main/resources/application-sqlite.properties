spring.application.name=movie-rating-system

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:./data/movierating.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate for SQLite
spring.jpa.database-platform=org.hibernate.community.dialects.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator/Monitoring
management.endpoints.web.exposure.include=health,prometheus,metrics
management.prometheus.metrics.export.enabled=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongAndSecure123456
jwt.expiration=86400000