global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      #- targets: ['app:8080'] # 'app' to nazwa serwisu w docker-compose
      - targets: ['rating-system-api-production.up.railway.app'] # Adres publiczny
rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"
