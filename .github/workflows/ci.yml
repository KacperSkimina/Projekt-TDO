name: Java CI with Maven

on:
  push:
    branches: [ "main", "infra/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build and Lint with Maven
      run: mvn verify # To uruchomi testy i checkstyle/linting
      working-directory: ./backend/rating-system