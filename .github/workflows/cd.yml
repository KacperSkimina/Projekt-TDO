name: CD - Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Uruchamia się przy tagach v1.0.0, v1.0.1 itd.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # Zamiana nazwy repozytorium na małe litery
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=${{ github.ref_name }}
          
          echo "Budowanie obrazu: ghcr.io/$REPO_LOWER:$IMAGE_TAG"
          
          docker build -t ghcr.io/$REPO_LOWER:$IMAGE_TAG ./backend/rating-system
          docker push ghcr.io/$REPO_LOWER:$IMAGE_TAG